[project]
name = "inbox-brief"
version = "1.0.0"
description = "Local, self-hosted daily audio brief from email."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]
onnx = ["kokoro-onnx>=0.4.7", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inbox_brief*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
